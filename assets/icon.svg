  <!-- 1-bit title-bar icon. Solid silhouette with the play triangle knocked
       out via fill-rule="evenodd" — no gradients, no grays, no sub-pixel
       strokes. E-ink is pure black and white, so anything in between dithers
       into noise at 24px. The rising-arrow motif from the full-colour icon is
       deliberately omitted: at this size it merges with the badge. -->
